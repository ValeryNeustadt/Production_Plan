<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post Production 2026</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@300;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#00d4aa;--bg:#0d0f14;--surface:#151820;--border:#1e2330;--text:#e8eaf0;--muted:#4a5060;}
:root.light{--bg:#f4f5f7;--surface:#fff;--border:#dde1ea;--text:#1a1d26;--muted:#8a93a8;--accent:#00a887;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",monospace;font-size:12px;}
body{display:flex;flex-direction:column;}
.tab-bar{display:flex;align-items:center;height:46px;flex-shrink:0;border-bottom:2px solid var(--border);background:var(--surface);padding:0 24px;position:relative;z-index:200;}
.tab-btn{font-family:"Unbounded",sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:0 18px;height:100%;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.global-theme{margin-left:auto;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:"JetBrains Mono",monospace;font-size:11px;padding:4px 11px;border-radius:6px;cursor:pointer;}
.global-theme:hover{border-color:var(--accent);color:var(--accent);}
.tab-panel{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0;}
.tab-panel.active{display:flex;}
/* Tab 1 scoped styles */
#tab1 { 
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --border: #1e2330;
    --text: #e8eaf0;
    --muted: #4a5060;
    --accent: #00d4aa;
  }

  :root.light {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #dde1ea;
    --text: #1a1d26;
    --muted: #8a93a8;
    --accent: #00a887;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .gantt-scroll-y {
    flex: 1;
    overflow-y: auto;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  header span { color: var(--muted); font-size: 11px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none; transition: opacity .2s;
  }
  .legend-item.hidden { opacity: 0.3; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
  .legend-label { color: var(--text); font-size: 11px; }

  .filter-bar {
    padding: 10px 32px;
    display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .filter-bar label { color: var(--muted); font-size: 11px; margin-right: 4px; }
  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  .gantt-wrapper {
    overflow-x: auto;
    max-height: calc(100vh - 180px);
    position: relative;
  }



  .gantt-inner {
    min-width: 1400px;
    position: relative;
  }

  /* ── sticky header block: months + load row ── */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .month-header {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  /* load row */
  .load-row {
    display: flex;
    border-bottom: 2px solid var(--border);
    height: 48px;
    background: var(--bg);
    position: relative;
  }

  .row-label-col {
    width: 260px; min-width: 260px; flex-shrink: 0;
    padding: 8px 12px;
    border-right: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    display: flex;
    align-items: center;
    position: sticky;
    left: 0;
    z-index: 20;
    background: var(--bg);
  }

  .month-cols { display: flex; flex: 1; }
  .month-cell {
    flex: 1; text-align: center; padding: 8px 4px;
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    border-right: 1px solid var(--border);
  }
  .month-cell:last-child { border-right: none; }

  /* load chart area */
  .load-chart {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .load-bar {
    position: absolute;
    bottom: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: opacity .15s;
    cursor: default;
  }
  .load-bar-inner {
    width: 100%;
    border-radius: 2px 2px 0 0;
    transition: height .3s ease;
  }
  .load-label {
    position: absolute;
    bottom: 2px;
    width: 100%;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
    line-height: 1;
  }
  .load-label.top {
    bottom: auto;
    top: 2px;
    color: var(--muted);
  }
  /* week separator ticks */
  .load-tick {
    position: absolute;
    bottom: 0;
    top: 0;
    width: 1px;
    background: var(--border);
    pointer-events: none;
  }

  /* gantt rows */
  .gantt-row:hover { background: rgba(255,255,255,.02); }
  .row-show { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
  .row-episode { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }



  .grid-lines { position: absolute; inset: 0; display: flex; pointer-events: none; }
  .grid-line { flex: 1; border-right: 1px solid var(--border); }
  .grid-line:last-child { border-right: none; }

  .today-line {
    position: absolute; top: 0; bottom: 0;
    width: 2px; background: var(--accent);
    opacity: 0.5; z-index: 3; pointer-events: none;
  }

  .bar {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 18px; border-radius: 3px;
    opacity: 0.88; transition: opacity .15s, transform .15s;
    cursor: pointer; z-index: 2;
  }
  .bar:hover { opacity: 1; transform: translateY(-50%) scaleY(1.15); }

  .group-header {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 5px 12px;
    font-family: 'Unbounded', sans-serif;
    font-size: 10px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase;
  }

  .tooltip {
    display: none; position: fixed;
    background: var(--surface); border: 1px solid var(--accent);
    color: var(--text); padding: 10px 14px;
    border-radius: 6px; font-size: 11px; line-height: 1.7;
    z-index: 1000; pointer-events: none; max-width: 240px;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .tooltip.visible { display: block; }
  .tooltip-show { color: var(--accent); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }

  /* ── theme toggle ── */
  .theme-toggle {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .2s, border-color .2s;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── row height control ── */
  :root { --row-h: 34px; --label-show: 1; }

  .gantt-row {
    display: flex;
    border-bottom: 1px solid var(--border);
    height: var(--row-h);
    min-height: unset;
    align-items: center;
    transition: background .15s, height .2s;
    overflow: hidden;
  }
  .chart-area {
    flex: 1;
    position: relative;
    height: var(--row-h);
    transition: height .2s;
  }
  .row-label {
    width: 260px; min-width: 260px; flex-shrink: 0;
    padding: 4px 12px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
    justify-content: center;
    position: sticky; left: 0;
    background: var(--surface); z-index: 5;
    height: 100%;
    overflow: hidden;
    transition: width .2s, min-width .2s;
  }

  /* compact: hide show-name sub-label */
  .compact-labels .row-show { display: none; }
  .compact-labels .row-episode { font-size: 10px; }

  /* minimal: hide entire label column */
  .no-labels .row-label { width: 0; min-width: 0; padding: 0; border-right: none; overflow: hidden; }
  .no-labels .row-label-col { width: 0; min-width: 0; padding: 0; border-right: none; overflow: hidden; }
  .no-labels .group-header { padding-left: 4px; }

  /* height slider */
  .height-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 16px;
  }
  .height-control label {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
  }
  .height-control input[type=range] {
    width: 90px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .height-val {
    color: var(--accent);
    font-size: 10px;
    min-width: 28px;
  }

 }
/* Tab 2 scoped styles */
#tab2 { 
:root{--bg:#0d0f14;--surface:#151820;--border:#1e2330;--text:#e8eaf0;--muted:#4a5060;--accent:#00d4aa;--lw:220px;--rh:30px;}
:root.light{--bg:#f4f5f7;--surface:#ffffff;--border:#dde1ea;--text:#1a1d26;--muted:#8a93a8;--accent:#00a887;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px}

header{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:16px;color:var(--accent)}
header span{color:var(--muted);font-size:11px}
.theme-btn{margin-left:auto;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:5px;cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:5px 14px;padding:7px 24px;border-bottom:1px solid var(--border)}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ldot{width:8px;height:8px;border-radius:2px}

.controls{padding:7px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.controls label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 7px;border-radius:4px;cursor:pointer}
.hctl{display:flex;align-items:center;gap:7px}
.hctl input{width:80px;accent-color:var(--accent);cursor:pointer}
.hval{color:var(--accent);font-size:10px;min-width:28px}

/* ── Two-panel layout ── */
.gantt-wrap{display:flex;height:calc(100vh - 185px);overflow:hidden}

/* Left panel: fixed labels, scrolls vertically in sync */
.g-left{
  width:var(--lw);min-width:var(--lw);flex-shrink:0;
  overflow-y:scroll;overflow-x:hidden;
  scrollbar-width:none;border-right:1px solid var(--border);
  background:var(--surface);
}
.g-left::-webkit-scrollbar{display:none}

/* Right panel: scrolls both axes */
.g-right-wrap{flex:1;overflow:auto;}
.g-right{min-width:900px;position:relative;}

/* Row heights matched via JS */
.l-row{
  display:flex;align-items:center;
  border-bottom:1px solid var(--border);
  height:var(--rh);overflow:hidden;
  padding:2px 10px 2px 12px;
  background:var(--surface);
  flex-shrink:0;
}
.r-row{
  position:relative;border-bottom:1px solid var(--border);
  height:var(--rh);overflow:hidden;flex-shrink:0;
}
.r-row .grid-lines{position:absolute;inset:0;display:flex;pointer-events:none}
.r-row .grid-line{flex:1;border-right:1px solid var(--border)}
.r-row .grid-line:last-child{border-right:none}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.5;z-index:3;pointer-events:none}

/* person header row */
.l-person{
  height:30px;display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;
  background:var(--surface);border-bottom:2px solid var(--border);border-top:1px solid var(--border);
  font-family:'Unbounded',sans-serif;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  flex-shrink:0;
}
.r-person{height:30px;background:var(--surface);border-bottom:2px solid var(--border);border-top:1px solid var(--border);}

/* month header */
.r-months{
  position:sticky;top:0;z-index:10;
  display:flex;height:30px;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.l-months{
  position:sticky;top:0;z-index:10;
  height:30px;display:flex;align-items:center;
  padding:0 12px;font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.month-cell{flex:1;text-align:center;line-height:30px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-right:1px solid var(--border)}
.month-cell:last-child{border-right:none}

/* label text */
.l-name{font-size:9px;opacity:.5;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-ep{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-sub-text{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-col{display:flex;flex-direction:column;gap:1px;flex:1;overflow:hidden}

/* bar */
.bar{position:absolute;top:50%;transform:translateY(-50%);border-radius:3px;opacity:.88;cursor:pointer;z-index:2}
.bar:hover{opacity:1}

/* toggle */
.toggle-btn{cursor:pointer;background:none;border:1px solid currentColor;border-radius:3px;font-size:8px;padding:1px 4px;color:inherit;font-family:inherit;opacity:.5;flex-shrink:0;line-height:1.3}
.toggle-btn:hover{opacity:1}

/* dot */
.person-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* sum row */
.l-sum{height:auto;min-height:26px;align-items:center;background:var(--bg);border-bottom:2px solid var(--border)}
.r-sum{min-height:26px;background:var(--bg);border-bottom:2px solid var(--border);display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:3px 8px}
.sum-stat{color:var(--muted);font-size:9px;white-space:nowrap}
.sum-stat strong{color:var(--text);font-weight:600}
.chip{padding:2px 6px;border-radius:9px;border:1px solid;font-size:9px;white-space:nowrap;opacity:.8}

.badge{font-size:8px;padding:1px 5px;border-radius:8px;border:1px solid;margin-left:3px;letter-spacing:.03em}

/* tooltip */
.tooltip{display:none;position:fixed;background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:8px 12px;border-radius:6px;font-size:11px;line-height:1.7;z-index:9999;pointer-events:none;max-width:210px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tooltip.vis{display:block}
.tt-show{color:var(--accent);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
 }
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab(0)">📅 Сценарии 2026</button>
  <button class="tab-btn" onclick="switchTab(1)">👥 Загрузка команды</button>
  <button class="global-theme" id="globalTheme" onclick="toggleGlobalTheme()">☀ Светлая</button>
</div>
<div class="tab-panel active" id="tab1"><header>
  <h1>СЦЕНАРИИ 2026</h1>
  <span>Дата начала → Дата окончания сценария</span>
  <button class="theme-toggle"  id="tab1_themeBtn">☀ Светлая</button>
</header>

<div class="legend" id="legend"></div>

<div class="filter-bar">
  <label>Период:</label>
  <select id="monthFilter" onchange="if(window._tab1)window._tab1.render()">
    <option value="all">Весь год</option>
    <option value="1">Янв</option><option value="2">Фев</option>
    <option value="3">Мар</option><option value="4">Апр</option>
    <option value="5">Май</option><option value="6">Июн</option>
    <option value="7">Июл</option><option value="8">Авг</option>
    <option value="9">Сен</option><option value="10">Окт</option>
    <option value="11">Ноя</option><option value="12">Дек</option>
  </select>
  <div class="height-control">
    <label>Высота строк:</label>
    <input type="range" id="rowHeightSlider" min="12" max="48" value="34" step="1" oninput="updateRowHeight(this.value)">
    <span class="height-val" id="rowHeightVal">34px</span>
  </div>
  <div class="height-control">
    <label>Масштаб:</label>
    <input type="range" id="tab1_zoom" min="750" max="4000" value="1400" step="50" oninput="setZoom1(this.value)">
    <span class="height-val" id="tab1_zoomVal">1400px</span>
  </div>
</div>

<div class="gantt-scroll-y">
<div class="gantt-wrapper">
  <div class="gantt-inner" id="ganttInner"></div>
</div>
</div>

<div class="tooltip" id="tooltip"></div></div>
<div class="tab-panel" id="tab2"><header>
  <h1>ЗАГРУЗКА КОМАНДЫ 2026</h1>
  <span>Post Production Department</span>
  <button class="theme-btn" id="tab2_themeBtn" >☀ Светлая</button>
</header>
<div class="legend">
  <div class="li"><div class="ldot" style="background:#E05C28"></div>Pognali</div>
  <div class="li"><div class="ldot" style="background:#7F77DD"></div>Pognali unrel.</div>
  <div class="li"><div class="ldot" style="background:#1D9E75"></div>Pognali.doc</div>
  <div class="li"><div class="ldot" style="background:#378ADD"></div>Faraway Rada</div>
  <div class="li"><div class="ldot" style="background:#85B7EB"></div>Faraway Ivleeva</div>
</div>
<div class="controls">
  <label>Период:</label>
  <select id="tab2_mf" onchange="if(window._tab2)window._tab2.render()">
    <option value="all">Весь год</option>
    <option value="1">Янв</option><option value="2">Фев</option>
    <option value="3">Мар</option><option value="4">Апр</option>
    <option value="5">Май</option><option value="6">Июн</option>
    <option value="7">Июл</option><option value="8">Авг</option>
    <option value="9">Сен</option><option value="10">Окт</option>
    <option value="11">Ноя</option><option value="12">Дек</option>
  </select>
  <div class="hctl">
    <label>Высота:</label>
    <input type="range" id="tab2_rh" min="14" max="48" value="30" step="1" oninput="setH2(this.value)">
    <span class="hval" id="tab2_rhv">30px</span>
  </div>
  <div class="hctl">
    <label>Масштаб:</label>
    <input type="range" id="tab2_zoom" min="500" max="4000" value="900" step="50" oninput="setZoom2(this.value)">
    <span class="hval" id="tab2_zoomVal">900px</span>
  </div>
</div>
<div class="gantt-wrap">
  <div class="g-left" id="tab2_gL"></div>
  <div class="g-right-wrap" id="tab2_gRW">
    <div class="g-right" id="tab2_gR"></div>
  </div>
</div>
<div class="tooltip" id="tab2_tt"></div></div>
<script>
// ── Tab switching ──────────────────────────────────────────────────────────
const tabPanels=document.querySelectorAll('.tab-panel');
const tabBtns=document.querySelectorAll('.tab-btn');
function switchTab(n){
  tabPanels.forEach((p,i)=>p.classList.toggle('active',i===n));
  tabBtns.forEach((b,i)=>b.classList.toggle('active',i===n));
  if(n===0&&window._tab1) window._tab1.render();
  if(n===1&&window._tab2) window._tab2.render();
}
function toggleGlobalTheme(){
  const isLight=document.documentElement.classList.toggle('light');
  document.getElementById('globalTheme').textContent=isLight?'☾ Тёмная':'☀ Светлая';
}
function setH2(v){ if(window._tab2_setH) window._tab2_setH(v); }
function setZoom1(v){
  v=parseInt(v);

// All weeks of 2026 (Mon–Sun)
function getAllWeeks() {
  const weeks = [];
  // Find first Monday on or before Jan 1 2026
  let d = new Date('2026-01-01');
  while (d.getDay() !== 1) d = new Date(d.getTime() - 86400000);
  while (d < new Date('2027-01-01')) {
    const start = new Date(d);
    const end = new Date(d.getTime() + 6 * 86400000);
    weeks.push({ start, end });
    d = new Date(d.getTime() + 7 * 86400000);
  }
  return weeks;
}

const ALL_WEEKS = getAllWeeks();

// Normalize RAW: if episode A starts on the same day episode B (same show) ends,
// shift A's start +1 day so they no longer overlap even for a single day.
(function normalizeRAW() {
  RAW.forEach((rowA, i) => {
    RAW.forEach((rowB, j) => {
      if (i === j || rowA[0] !== rowB[0]) return;
      if (rowA[2] === rowB[3]) {
        const d = new Date(rowA[2]);
        d.setDate(d.getDate() + 1);
        rowA[2] = d.toISOString().slice(0, 10);
      }
    });
  });
})();

// Count overlapping projects per week (always all shows)
// Rule: if multiple episodes of the SAME show both touch a given week
// (end of one and start of next both fall within the same week),
// they are treated as ONE continuous project for that week.
function computeLoad(weeks) {
  return weeks.map(w => {
    let full = 0, partial = 0;

    const showEpisodes = {};
    RAW.forEach(row => {
      if (hiddenShows.has(row[0])) return;
      const s = new Date(row[2]);
      const e = new Date(row[3]);
      if (s > w.end || e < w.start) return;
      if (!showEpisodes[row[0]]) showEpisodes[row[0]] = [];
      showEpisodes[row[0]].push({ s, e });
    });

    Object.values(showEpisodes).forEach(episodes => {
      episodes.sort((a, b) => a.s - b.s);
      // Merge episodes that are both touching this same week
      // (i.e. both fall within [w.start, w.end] — transition happens inside the week)
      const merged = [{ s: episodes[0].s, e: episodes[0].e }];
      for (let i = 1; i < episodes.length; i++) {
        const last = merged[merged.length - 1];
        // Both the end of previous and start of next are within this week => same project
        const prevEndInWeek  = last.e >= w.start && last.e <= w.end;
        const nextStartInWeek = episodes[i].s >= w.start && episodes[i].s <= w.end;
        if (prevEndInWeek && nextStartInWeek) {
          // Transition inside this week: merge into one logical project
          if (episodes[i].e > last.e) last.e = episodes[i].e;
        } else {
          merged.push({ s: episodes[i].s, e: episodes[i].e });
        }
      }
      merged.forEach(({ s, e }) => {
        if (s <= w.start && e >= w.end) full++;
        else partial++;
      });
    });

    return { full, partial };
  });
}

function loadColor(n, max) {
  // green → yellow → red
  const t = Math.min(n / max, 1);
  if (t < 0.5) {
    const r = Math.round(255 * (t * 2));
    return `rgb(${r},200,80)`;
  } else {
    const g = Math.round(200 * (1 - (t - 0.5) * 2));
    return `rgb(255,${g},60)`;
  }
}

function render1_inner() {
  const filterMonth = document.getElementById('monthFilter').value;
  const inner = document.getElementById('ganttInner');
  inner.innerHTML = '';

  let rangeStart, rangeEnd;
  if (filterMonth === 'all') {
    rangeStart = new Date('2026-01-01');
    rangeEnd   = new Date('2026-12-31');
  } else {
    const m = parseInt(filterMonth) - 1;
    rangeStart = new Date(2026, m, 1);
    rangeEnd   = new Date(2026, m+1, 0);
  }
  const rangeMs = rangeEnd - rangeStart;

  function toPct(date) {
    return Math.max(0, Math.min(100, ((date - rangeStart) / rangeMs) * 100));
  }
  function toPctStr(dateStr) { return toPct(new Date(dateStr)); }

  // Today line
  const today = new Date('2026-06-03');
  const todayPct = toPct(today);

  // Weeks visible in range
  const visibleWeeks = ALL_WEEKS.filter(w => w.end >= rangeStart && w.start <= rangeEnd);
  const loads = computeLoad(visibleWeeks);
  // maxLoad computed per row below

  // ── STICKY HEADER ──
  const stickyHeader = document.createElement('div');
  stickyHeader.className = 'sticky-header';

  // Month row
  const monthHeader = document.createElement('div');
  monthHeader.className = 'month-header';
  const lc1 = document.createElement('div');
  lc1.className = 'row-label-col';
  lc1.textContent = 'ПРОЕКТ / ЭПИЗОД';
  monthHeader.appendChild(lc1);

  const monthCols = document.createElement('div');
  monthCols.className = 'month-cols';
  if (filterMonth === 'all') {
    MONTHS.forEach(m => {
      const cell = document.createElement('div');
      cell.className = 'month-cell';
      cell.textContent = m;
      monthCols.appendChild(cell);
    });
  } else {
    ['Нед 1','Нед 2','Нед 3','Нед 4'].forEach(w => {
      const cell = document.createElement('div');
      cell.className = 'month-cell';
      cell.textContent = w;
      monthCols.appendChild(cell);
    });
  }
  monthHeader.appendChild(monthCols);
  stickyHeader.appendChild(monthHeader);

  function buildLoadRow(labelText, getValue, colorFn, maxVal) {
    const row = document.createElement('div');
    row.className = 'load-row';

    const lc = document.createElement('div');
    lc.className = 'row-label-col';
    lc.textContent = labelText;
    row.appendChild(lc);

    const chart = document.createElement('div');
    chart.className = 'load-chart';

    visibleWeeks.forEach((w, i) => {
      const count = getValue(loads[i]);
      if (count === 0) return;

      const leftPct  = toPct(w.start);
      const rightPct = toPct(new Date(w.end.getTime() + 86400000));
      const wPct = Math.max(0, rightPct - leftPct);
      if (wPct <= 0) return;

      const heightPct = Math.max(15, (count / maxVal) * 85);
      const color = colorFn(count, maxVal);

      const bar = document.createElement('div');
      bar.className = 'load-bar';
      bar.style.left   = leftPct + '%';
      bar.style.width  = wPct + '%';
      bar.style.height = '100%';

      const inner2 = document.createElement('div');
      inner2.className = 'load-bar-inner';
      inner2.style.height = heightPct + '%';
      inner2.style.background = color;
      inner2.style.opacity = '0.75';
      bar.appendChild(inner2);

      const lbl = document.createElement('div');
      lbl.className = 'load-label';
      lbl.textContent = count;
      bar.appendChild(lbl);

      bar.title = `Неделя ${fmtDate(w.start.toISOString().slice(0,10))} – ${fmtDate(w.end.toISOString().slice(0,10))}: ${count}`;
      chart.appendChild(bar);
    });

    if (todayPct >= 0 && todayPct <= 100) {
      const tl = document.createElement('div');
      tl.style.cssText = `position:absolute;top:0;bottom:0;left:${todayPct}%;width:2px;background:var(--accent);opacity:0.5;z-index:3;pointer-events:none;`;
      chart.appendChild(tl);
    }

    row.appendChild(chart);
    return row;
  }

  const maxFull    = Math.max(...loads.map(l => l.full), 1);
  const maxPartial = Math.max(...loads.map(l => l.partial), 1);

  stickyHeader.appendChild(buildLoadRow(
    'ПОЛНЫЕ / НЕД.',
    l => l.full,
    loadColor,
    maxFull
  ));

  stickyHeader.appendChild(buildLoadRow(
    'ЧАСТИЧНЫЕ / НЕД.',
    l => l.partial,
    (n, max) => {
      const t = Math.min(n / max, 1);
      const b = Math.round(120 + 135 * t);
      const g = Math.round(160 - 80 * t);
      return `rgb(60,${g},${b})`;
    },
    maxPartial
  ));
  inner.appendChild(stickyHeader);

  // ── GANTT ROWS ──
  const groups = {};
  RAW.forEach(row => {
    if (!groups[row[0]]) groups[row[0]] = [];
    groups[row[0]].push(row);
  });

  Object.entries(groups).forEach(([show, rows]) => {
    if (hiddenShows.has(show)) return;

    const gh = document.createElement('div');
    gh.className = 'group-header';
    gh.style.color = SHOWS[show]?.color || '#888';
    gh.textContent = SHOWS[show]?.label || show;
    inner.appendChild(gh);

    rows.forEach(row => {
      const start = new Date(row[2]);
      const end   = new Date(row[3]);
      if (end < rangeStart || start > rangeEnd) return;

      const tr = document.createElement('div');
      tr.className = 'gantt-row';

      const lbl = document.createElement('div');
      lbl.className = 'row-label';
      lbl.innerHTML = `<span class="row-show" style="color:${SHOWS[show]?.color||'#888'}">${show}</span><span class="row-episode">${row[1]}</span>`;
      tr.appendChild(lbl);

      const area = document.createElement('div');
      area.className = 'chart-area';

      // grid
      const grid = document.createElement('div');
      grid.className = 'grid-lines';
      const cols = filterMonth === 'all' ? 12 : 4;
      for (let i = 0; i < cols; i++) {
        const gl = document.createElement('div'); gl.className = 'grid-line'; grid.appendChild(gl);
      }
      area.appendChild(grid);

      // today
      if (todayPct >= 0 && todayPct <= 100) {
        const tl = document.createElement('div');
        tl.className = 'today-line';
        tl.style.left = todayPct + '%';
        area.appendChild(tl);
      }

      // bar
      const sPct = toPctStr(row[2]);
      const ePct = toPctStr(row[3]);
      const wPct = Math.max(0.4, ePct - sPct);

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.left = sPct + '%';
      bar.style.width = wPct + '%';
      bar.style.background = SHOWS[show]?.color || '#888';
      bar.addEventListener('mouseenter', e => showTooltip(e, row));
      bar.addEventListener('mousemove', moveTooltip);
      bar.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
      area.appendChild(bar);

      tr.appendChild(area);
      inner.appendChild(tr);
    });
  });
}

function updateRowHeight(val) {
  val = parseInt(val);
  document.getElementById('rowHeightVal').textContent = val + 'px';
  document.documentElement.style.setProperty('--row-h', val + 'px');

  const inner = document.getElementById('ganttInner');
  // label visibility modes based on height
  if (val <= 16) {
    // so small — hide labels entirely
    inner.classList.add('no-labels');
    inner.classList.remove('compact-labels');
  } else if (val <= 26) {
    // compact — show only episode name, no show sub-label
    inner.classList.add('compact-labels');
    inner.classList.remove('no-labels');
  } else {
    // full — show everything
    inner.classList.remove('no-labels');
    inner.classList.remove('compact-labels');
  }

  // also scale bar height proportionally
  const barH = Math.max(4, Math.round(val * 0.52));
  document.querySelectorAll('.bar').forEach(b => {
    b.style.height = barH + 'px';
  });
}

function getRng(f){
  if(f==='all') return{s:new Date('2026-01-01'),e:new Date('2026-12-31')};
  const m=parseInt(f); return{s:new Date(2026,m-1,1),e:new Date(2026,m,0)};
}
function toPct(d,rs,rm){return Math.max(0,Math.min(100,((new Date(d)-rs)/rm)*100))}

// Tooltip
const tt=document.getElementById('tab2_tt');
function showTip(e,t){
  const dur=Math.round((new Date(t.e)-new Date(t.s))/86400000);
  tt.innerHTML=`<div class="tt-show">${t.show}</div><div>${t.ep}</div>
    <div style="margin-top:4px;color:var(--muted)">Начало: <span style="color:var(--text)">${fmt(t.s)}</span></div>
    <div>Конец: <span style="color:var(--text)">${fmt(t.e)}</span></div>
    <div>Длит.: <span style="color:var(--text)">${dur} дн.</span></div>`;
  tt.classList.add('vis'); moveTip(e);
}
function moveTip(e){tt.style.left=Math.min(e.clientX+14,window.innerWidth-230)+'px';tt.style.top=(e.clientY-10)+'px';}

// Sync vertical scroll between left and right panels
let syncLock2=false;
document.addEventListener('DOMContentLoaded',()=>{
  const gL=document.getElementById('tab2_gL');
  const gRW=document.getElementById('tab2_gRW');
  gL.addEventListener('scroll',()=>{if(!syncLock2){syncLock2=true;gRW.scrollTop=gL.scrollTop;syncLock2=false;}});
  gRW.addEventListener('scroll',()=>{if(!syncLock2){syncLock2=true;gL.scrollTop=gRW.scrollTop;syncLock2=false;}});
});

let rowH=30;
const openState=new Set(); // tracks which persons have breakdown open

function render2_inner(){
  const gL=document.getElementById('tab2_gL'); gL.innerHTML='';
  const gR=document.getElementById('tab2_gR'); gR.innerHTML='';
  const f=document.getElementById('tab2_mf').value;
  const{s:rs,e:re}=getRng(f);
  const rm=re-rs;
  const tp=toPct(TODAY,rs,rm);
  function p(d){return toPct(d,rs,rm)}

  function addGrid(el){
    const g=document.createElement('div'); g.className='grid-lines';
    const n=f==='all'?12:4;
    for(let i=0;i<n;i++){const c=document.createElement('div');c.className='grid-line';g.appendChild(c);}
    if(tp>=0&&tp<=100){const tl=document.createElement('div');tl.className='today-line';tl.style.left=tp+'%';g.appendChild(tl);}
    el.appendChild(g);
  }

  function addRow(lContent, rBuilder, h, extraClass=''){
    h=h||rowH;
    const lEl=document.createElement('div');
    lEl.className='l-row '+(extraClass);
    lEl.style.height=h+'px';
    lContent(lEl);
    gL.appendChild(lEl);

    const rEl=document.createElement('div');
    rEl.className='r-row '+(extraClass);
    rEl.style.height=h+'px';
    addGrid(rEl);
    rBuilder(rEl);
    gR.appendChild(rEl);
    return{lEl,rEl};
  }

  // Month header
  const lmH=document.createElement('div'); lmH.className='l-months'; lmH.textContent='СОТРУДНИК / ЗАДАЧА';
  gL.appendChild(lmH);
  const rmH=document.createElement('div'); rmH.className='r-months';
  (f==='all'?MONTHS:['Нед 1','Нед 2','Нед 3','Нед 4']).forEach(m=>{
    const c=document.createElement('div');c.className='month-cell';c.textContent=m;rmH.appendChild(c);
  });
  gR.appendChild(rmH);

  PEOPLE.forEach(person=>{
    // Person header
    const lph=document.createElement('div'); lph.className='l-person'; lph.style.color=person.color;
    const dot=document.createElement('div'); dot.className='person-dot'; dot.style.background=person.color; lph.appendChild(dot);
    lph.appendChild(document.createTextNode(person.name));
    gL.appendChild(lph);
    const rph=document.createElement('div'); rph.className='r-person'; gR.appendChild(rph);

    // Tasks in range
    const tasks=person.tasks.filter(t=>new Date(t.e)>=rs&&new Date(t.s)<=re);

    // Main row
    const lMain=document.createElement('div'); lMain.className='l-row'; lMain.style.height=rowH+'px';
    const lcol=document.createElement('div'); lcol.className='l-col';
    const lname=document.createElement('span'); lname.className='l-name'; lname.style.color=person.color; lname.textContent=person.label;
    const lep=document.createElement('span'); lep.className='l-ep'; lep.textContent=person.label;
    // toggle btn
    const btn=document.createElement('button'); btn.className='toggle-btn'; btn.textContent='▼'; btn.title='По проектам';
    btn.style.color=person.color;
    lcol.appendChild(lname); lMain.appendChild(lcol); lMain.appendChild(btn);
    gL.appendChild(lMain);

    const rMain=document.createElement('div'); rMain.className='r-row'; rMain.style.height=rowH+'px';
    addGrid(rMain);
    tasks.forEach(t=>{
      const sp=p(t.s),ep2=p(t.e),w=Math.max(0.3,ep2-sp);
      const bar=document.createElement('div'); bar.className='bar';
      const bh=Math.max(6,Math.round(rowH*.55));
      bar.style.cssText=`left:${sp}%;width:${w}%;background:${col(t.show)};height:${bh}px`;
      bar.addEventListener('mouseenter',e=>showTip(e,t));
      bar.addEventListener('mousemove',moveTip);
      bar.addEventListener('mouseleave',()=>tt.classList.remove('vis'));
      rMain.appendChild(bar);
    });
    gR.appendChild(rMain);

    // Sub rows per show
    const shows=[...new Set(tasks.map(t=>t.show))].sort((a,b)=>{
      const ai=SHOW_ORDER.indexOf(a),bi=SHOW_ORDER.indexOf(b);
      return(ai<0?99:ai)-(bi<0?99:bi);
    });
    const subPairs=[];
    shows.forEach(show=>{
      const showTasks=tasks.filter(t=>t.show===show);

      const lSub=document.createElement('div'); lSub.className='l-row sub-row'; lSub.style.cssText=`height:${rowH}px;display:none;background:rgba(255,255,255,.01)`;
      const st=document.createElement('span'); st.className='l-sub-text';
      st.innerHTML=`<span style="opacity:.4;font-size:9px">${person.label} | </span><span style="color:${col(show)}">${show}</span>`;
      lSub.appendChild(st); gL.appendChild(lSub);

      const rSub=document.createElement('div'); rSub.className='r-row sub-row'; rSub.style.cssText=`height:${rowH}px;display:none;background:rgba(255,255,255,.01)`;
      addGrid(rSub);
      const bh=Math.max(5,Math.round(rowH*.42));
      showTasks.forEach(t=>{
        const sp=p(t.s),ep2=p(t.e),w=Math.max(0.3,ep2-sp);
        const bar=document.createElement('div'); bar.className='bar';
        bar.style.cssText=`left:${sp}%;width:${w}%;background:${col(t.show)};height:${bh}px;opacity:.8`;
        bar.addEventListener('mouseenter',e=>showTip(e,t));
        bar.addEventListener('mousemove',moveTip);
        bar.addEventListener('mouseleave',()=>tt.classList.remove('vis'));
        rSub.appendChild(bar);
      });
      gR.appendChild(rSub);
      subPairs.push({lSub,rSub});
    });

    const stateKey=person.name;
    if(openState.has(stateKey)){
      subPairs.forEach(({lSub,rSub})=>{lSub.style.display='flex';rSub.style.display='flex';});
      btn.textContent='▲';
    }
    btn.onclick=()=>{
      const open=subPairs.length>0&&subPairs[0].lSub.style.display!=='none';
      if(open) openState.delete(stateKey); else openState.add(stateKey);
      subPairs.forEach(({lSub,rSub})=>{lSub.style.display=open?'none':'flex';rSub.style.display=open?'none':'flex';});
      btn.textContent=open?'▼':'▲';
      requestAnimationFrame(syncHeights2);
    };

    // Summary row
    const byShow={};let totalEp=0,totalDays=0;
    tasks.forEach(t=>{byShow[t.show]=(byShow[t.show]||0)+1;totalEp++;totalDays+=Math.round((new Date(t.e)-new Date(t.s))/86400000);});

    const lSum=document.createElement('div'); lSum.className='l-row l-sum';
    lSum.style.minHeight='26px';
    const lSumTxt=document.createElement('span'); lSumTxt.style.cssText='font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em'; lSumTxt.textContent='Итого / окна';
    lSum.appendChild(lSumTxt); gL.appendChild(lSum);

    const rSum=document.createElement('div'); rSum.className='r-sum';
    const stat=document.createElement('span'); stat.className='sum-stat';
    stat.innerHTML=`<strong>${totalEp}</strong> эп. · <strong>${Math.round(totalDays/7)}</strong> нед.`;
    rSum.appendChild(stat);
    Object.entries(byShow).forEach(([show,cnt])=>{
      const ch=document.createElement('span'); ch.className='chip';
      const c=col(show); ch.style.borderColor=c; ch.style.color=c;
      ch.textContent=`${show.replace(' unrel.','★').replace('Faraway ','')} ×${cnt}`; rSum.appendChild(ch);
    });

    gR.appendChild(rSum);
  });
  // Sync row heights after DOM is painted
  requestAnimationFrame(()=>requestAnimationFrame(syncHeights2));
}

function syncHeights2(){
  // Only sync sum rows (variable height due to chip wrapping)
  const lSums=document.querySelectorAll('#gL .l-sum');
  const rSums=document.querySelectorAll('#gR .r-sum');
  const n=Math.min(lSums.length,rSums.length);
  for(let i=0;i<n;i++){
    lSums[i].style.height='';
    rSums[i].style.height='';
    const h=Math.max(lSums[i].scrollHeight, rSums[i].scrollHeight, 26);
    lSums[i].style.height=h+'px';
    rSums[i].style.height=h+'px';
  }
}

function setH(v){
  rowH=parseInt(v);
  document.getElementById('tab2_rhv').textContent=v+'px';
  render2_inner(); // openState preserves which rows are open
}

function toggleTheme2(){
  const r=document.documentElement,b=document.getElementById('tab2_themeBtn');
  r.classList.toggle('light'); b.textContent=r.classList.contains('light')?'☾ Тёмная':'☀ Светлая';
}

render2_inner();
setTimeout(syncHeights2,50);

window._tab2 = { render: render2_inner };
window._tab2_setH = function(v) {
  rowH = parseInt(v);
  document.getElementById('tab2_rhv').textContent = v + 'px';
  render2_inner();
};
})();
</script>
